<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #0088cc;
            --secondary-color: #f8f9fa;
            --accent-color: #17a2b8;
            --text-color: #333;
            --border-color: #dee2e6;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            color: white;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        .category-filter {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            outline: none;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .item-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }

        .item-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .item-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .item-description {
            color: #666;
            line-height: 1.4;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .item-category {
            background: var(--accent-color);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #006699;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 50px;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 50px 20px;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: var(--hover-shadow);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Telegram Marketplace</h1>
            <p>Discover amazing items from our community</p>
        </div>

        <div class="stats-bar" id="stats-bar">
            <div class="stat-item">
                <span class="stat-number" id="total-items">0</span>
                <span class="stat-label">Total Items</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="total-value">$0</span>
                <span class="stat-label">Total Value</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="categories-count">0</span>
                <span class="stat-label">Categories</span>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Search items...">
            <select id="category-filter" class="category-filter">
                <option value="all">All Categories</option>
            </select>
            <button id="refresh-btn" class="btn btn-secondary">🔄 Refresh</button>
        </div>

        <div id="items-container">
            <div class="loading">Loading marketplace items...</div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        
        // Expand to full screen and enable closing confirmation
        tg.expand();
        tg.enableClosingConfirmation();
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            tg.close();
        });

        // Global state
        let state = {
            items: [],
            categories: [],
            filteredItems: [],
            currentCategory: 'all',
            searchQuery: ''
        };

        // DOM elements
        const elements = {
            itemsContainer: document.getElementById('items-container'),
            searchInput: document.getElementById('search-input'),
            categoryFilter: document.getElementById('category-filter'),
            refreshBtn: document.getElementById('refresh-btn'),
            statsBar: document.getElementById('stats-bar'),
            totalItems: document.getElementById('total-items'),
            totalValue: document.getElementById('total-value'),
            categoriesCount: document.getElementById('categories-count'),
            notification: document.getElementById('notification')
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', async () => {
            await loadStats();
            await loadCategories();
            await loadItems();
            setupEventListeners();
        });

        // Load marketplace statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                elements.totalItems.textContent = stats.total_items;
                elements.totalValue.textContent = `$${stats.total_value.toFixed(2)}`;
                elements.categoriesCount.textContent = stats.categories_count;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                state.categories = await response.json();
                
                // Populate category filter
                elements.categoryFilter.innerHTML = '<option value="all">All Categories</option>';
                state.categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                    elements.categoryFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Load items
        async function loadItems() {
            try {
                elements.itemsContainer.innerHTML = '<div class="loading">Loading marketplace items...</div>';
                
                const params = new URLSearchParams();
                if (state.currentCategory !== 'all') {
                    params.append('category', state.currentCategory);
                }
                if (state.searchQuery) {
                    params.append('search', state.searchQuery);
                }
                
                const response = await fetch(`/api/items?${params}`);
                state.items = await response.json();
                state.filteredItems = state.items;
                
                renderItems();
            } catch (error) {
                console.error('Error loading items:', error);
                showError('Failed to load items. Please try again.');
            }
        }

        // Render items grid
        function renderItems() {
            if (state.filteredItems.length === 0) {
                elements.itemsContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>No items found</h3>
                        <p>Try changing your search or category filter</p>
                    </div>
                `;
                return;
            }
            
            elements.itemsContainer.innerHTML = '<div class="items-grid" id="items-grid"></div>';
            const grid = document.getElementById('items-grid');
            
            state.filteredItems.forEach(item => {
                const itemCard = document.createElement('div');
                itemCard.className = 'item-card';
                itemCard.innerHTML = `
                    <div class="item-image">
                        ${item.image || '📦'}
                    </div>
                    <div class="item-name">${escapeHtml(item.name)}</div>
                    <div class="item-price">$${item.price.toFixed(2)}</div>
                    <div class="item-description">${escapeHtml(item.description)}</div>
                    <div class="item-meta">
                        <span class="item-seller">👤 ${escapeHtml(item.seller)}</span>
                        <span class="item-category">${escapeHtml(item.category)}</span>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="buyItem(${item.id})">
                            💰 Buy Now
                        </button>
                        <button class="btn btn-secondary" onclick="contactSeller('${escapeHtml(item.seller)}')">
                            📞 Contact
                        </button>
                    </div>
                `;
                grid.appendChild(itemCard);
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            elements.searchInput.addEventListener('input', debounce((e) => {
                state.searchQuery = e.target.value;
                loadItems();
            }, 300));
            
            elements.categoryFilter.addEventListener('change', (e) => {
                state.currentCategory = e.target.value;
                loadItems();
            });
            
            elements.refreshBtn.addEventListener('click', () => {
                loadStats();
                loadItems();
                showNotification('Marketplace refreshed!');
            });
        }

        // Buy item function
        function buyItem(itemId) {
            tg.showPopup({
                title: "Confirm Purchase",
                message: "Are you sure you want to buy this item? The seller will contact you to arrange payment and delivery.",
                buttons: [
                    {id: "confirm", type: "default", text: "✅ Confirm Purchase"},
                    {id: "cancel", type: "cancel"}
                ]
            }, (buttonId) => {
                if (buttonId === "confirm") {
                    tg.sendData(JSON.stringify({
                        action: "purchase",
                        item_id: itemId,
                        timestamp: new Date().toISOString()
                    }));
                    showNotification('Purchase confirmed! Seller will contact you soon.');
                }
            });
        }

        // Contact seller function
        function contactSeller(seller) {
            tg.showPopup({
                title: "Contact Seller",
                message: `Send a message to @${seller}? They will be notified of your interest.`,
                buttons: [
                    {id: "confirm", type: "default", text: "📞 Contact Seller"},
                    {id: "cancel", type: "cancel"}
                ]
            }, (buttonId) => {
                if (buttonId === "confirm") {
                    tg.sendData(JSON.stringify({
                        action: "contact_seller",
                        seller: seller,
                        timestamp: new Date().toISOString()
                    }));
                    showNotification('Seller notified! They will contact you soon.');
                }
            });
        }

        // Utility functions
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function showNotification(message) {
            elements.notification.textContent = message;
            elements.notification.classList.add('show');
            setTimeout(() => {
                elements.notification.classList.remove('show');
            }, 3000);
        }

        function showError(message) {
            elements.itemsContainer.innerHTML = `
                <div class="error">
                    <h3>⚠️ Error</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="loadItems()" style="margin-top: 10px;">
                        Try Again
                    </button>
                </div>
            `;
        }

        // Make functions globally available
        window.buyItem = buyItem;
        window.contactSeller = contactSeller;
    </script>
</body>
</html>
